{% extends "base.html" %}
{% load static %}

{% block title %}Actualizar Entrega{% endblock %}

{% block content %}
<div class="container-sm mt-4">
    <div class="d-flex justify-content align-items-center">
        <div class="col-md-8">
            <div class="card shadow-lg p-4">
                <h2 class="text-center mb-4">🚚 Actualizar Entrega</h2>
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="{{ form.fecha_llegada.id_for_label }}" class="form-label">📅 Fecha de Llegada:</label>
                        {{ form.fecha_llegada }}
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.remision.id_for_label }}" class="form-label">📜 Remisión:</label>
                        {{ form.remision }}
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.fecha_remision.id_for_label }}" class="form-label">📅 Fecha de Remisión:</label>
                        {{ form.fecha_remision }}
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.doc_sag.id_for_label }}" class="form-label">📄 Documento SAG:</label>
                        {{ form.doc_sag }}
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-success px-5">✔️ Guardar y Marcar como Entregada</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="position-fixed bottom-0 end-0 p-3" style="opacity: 0.2;">
        <img src="{% static 'img/logo.png' %}" alt="Logo Empresa" width="180">
    </div>
</div>
{% endblock %}
