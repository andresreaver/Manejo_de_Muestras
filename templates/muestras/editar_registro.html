{% extends "base.html" %}

{% block title %}Editar Registro{% endblock %}

{% block content %}
<div class="container-sm mt-4 position-relative">
    <div class="d-flex justify-content align-items-center">
        <div class="col-md-8">
            <div class="card shadow-lg p-4">
                <h2 class="text-center mb-4">✏️ Editar Registro</h2>

                <form method="post" class="needs-validation">
                    {% csrf_token %}

                    <div class="row">
                        <!-- Primera columna -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="{{ form.cliente.id_for_label }}" class="form-label">Cliente:</label>
                                {{ form.cliente }}
                            </div>
                            <div class="mb-3">
                                <label for="{{ form.comercial.id_for_label }}" class="form-label">Comercial:</label>
                                {{ form.comercial }}
                            </div>
                            <div class="mb-3">
                                <label for="{{ form.color.id_for_label }}" class="form-label">Color:</label>
                                {{ form.color }}
                            </div>
                        </div>

                        <!-- Segunda columna -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="{{ form.referencia.id_for_label }}" class="form-label">Referencia:</label>
                                {{ form.referencia }}
                            </div>
                            <div class="mb-3">
                                <label for="{{ form.tipo.id_for_label }}" class="form-label">Tipo:</label>
                                {{ form.tipo }}
                            </div>
                            <div class="mb-3">
                                <label for="{{ form.hdr.id_for_label }}" class="form-label">HDR:</label>
                                {{ form.hdr }}
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-success px-5">💾 Guardar Cambios</button>
                        <a href="{% url 'lista_registros' %}" class="btn btn-secondary px-5">↩️ Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
