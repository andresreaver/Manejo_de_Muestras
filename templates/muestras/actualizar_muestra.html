{% extends "base.html" %}
{% load static %}
{% block title %}Actualizar Muestra{% endblock %}
{% block content %}

<div class="container-sm mt-4">
    <div class="d-flex justify-content align-items-center">
        <div class="col-md-8">
            <div class="card shadow-lg p-4">
                <h2 class="text-center mb-4">🔄 Actualizar Muestra</h2>
                <form method="post" class="needs-validation">
                    {% csrf_token %}

                    <div class="row">
                        <!-- Primera columna -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="{{ form.fecha_envio.id_for_label }}" class="form-label">📅 Fecha de Envío:</label>
                                {{ form.fecha_envio }}
                            </div>
                            <div class="mb-3">
                                <label for="{{ form.metros_enviados.id_for_label }}" class="form-label">📏 Metros Enviados:</label>
                                {{ form.metros_enviados }}
                            </div>
                            <div class="mb-3">
                                <label for="{{ form.kg_enviados.id_for_label }}" class="form-label">⚖️ Kg Enviados:</label>
                                {{ form.kg_enviados }}
                            </div>
                        </div>

                        <!-- Segunda columna -->
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="{{ form.hdr.id_for_label }}" class="form-label">📜 HDR:</label>
                                {{ form.hdr }}
                            </div>
                            <div class="mb-3">
                                <label for="{{ form.tipo.id_for_label }}" class="form-label">🔠 Tipo:</label>
                                {{ form.tipo }}
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-success px-5">💾 Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="position-fixed bottom-0 end-0 p-3" style="opacity: 0.2;">
        <img src="{% static 'img/logo.png' %}" alt="Logo Empresa" width="180">
    </div>
</div>

{% endblock %}
